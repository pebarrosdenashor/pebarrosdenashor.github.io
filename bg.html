<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Fichas (fundo)</title></head>
<body>
<script type="module">
import OBR, { buildLine } from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";

const P = "rpg.fichas/r.";
const TK = "rpg.fichas/tok"; // metadado do token: { k: "p" (personagem) | "e" (inimigo), i: id }

// Junta as rolagens de todos os jogadores (cada um grava a sua própria lista).
const todas = md => Object.entries(md || {})
  .filter(([k]) => k.startsWith(P))
  .flatMap(([k, v]) => (v || []).map(r => ({ ...r, pid: k.slice(P.length) })));

// ================= Efeitos de golpe no mapa =================
// Os efeitos são "itens locais" do Owlbear: só existem na tela de cada jogador, não ficam salvos na cena e são
// apagados no fim. Cada quadro desenha uma lista de segmentos [a, b, largura, opacidade, cor].
const FX_T0 = 380;                       // começa no meio do lançamento dos dados, como no prato
const FX_DUR = { vespas: 1300, flecha: 1000 };
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const EA = { out: t => 1 - Math.pow(1 - t, 3), in: t => t * t * t, io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2 };
const hs = (i, k) => { const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); };
const add = (a, b) => [a[0] + b[0], a[1] + b[1]], mul = (a, k) => [a[0] * k, a[1] * k], lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const pol = (c, r, t) => [c[0] + r * Math.cos(t), c[1] + r * Math.sin(t)];
const rad = g => g * Math.PI / 180;

// Ferramentas de desenho; "L" é a lista de segmentos do quadro atual.
function kit(L, U) {
  const seg = (a, b, w, op, col = "#ffffff") => { if (op > .02 && w > .5) L.push([a, b, w, op, col]); };
  // Risco curvo que avança, afina nas pontas e some (P(s) devolve o ponto da curva, s de 0 a 1).
  const corte = (u, d0, dur, P, w, halo, op = 1) => {
    if (u < d0) return;
    const v = cl((u - d0) / dur), head = EA.out(cl(v / .42)), tail = EA.in(cl((v - .2) / .55)), s1 = head, s0 = tail * head;
    if (s1 - s0 < .01) return;
    const o = op * (1 - cl((v - .72) / .28)), n = 14;
    for (let i = 0; i < n; i++) {
      const a = s0 + (s1 - s0) * i / n, b = s0 + (s1 - s0) * (i + 1) / n, ww = w * Math.pow(Math.sin(Math.PI * (a + b) / 2), .8);
      seg(P(a), P(b), ww * 2.6, o * .35, halo); seg(P(a), P(b), ww, o);
    }
  };
  const anel = (c, r, w, op, col, n = 26) => { for (let i = 0; i < n; i++) seg(pol(c, r, i * 2 * Math.PI / n), pol(c, r, (i + 1) * 2 * Math.PI / n), w, op, col); };
  const estrela = (c, r, op, col = "#ffffff") => { if (op <= 0 || r <= 0) return; for (let i = 0; i < 4; i++) { const a = rad(45 * i + 10), q = i % 2 ? r * .55 : r; seg(pol(c, -q, a), pol(c, q, a), U * .07 * (i % 2 ? .7 : 1), op, col); } };
  const chispas = (c, t, n, vmax, col, w) => { for (let i = 0; i < n; i++) { const a = hs(i, 1) * 6.283, v = (.4 + hs(i, 2) * .6) * vmax; seg(pol(c, v * Math.max(0, t - .07), a), pol(c, v * t, a), w, 1 - t, col); } };
  return { seg, corte, anel, estrela, chispas };
}

// Cada efeito recebe: u (0..1), k = { O: origem (atacante), Q: ponto do golpe, T: alvo, d: direção, nr: perpendicular, ang, s: tamanho do token, U: casa do grid }.
const FX = {
  espada(u, k, K) {
    const { Q, ang, U } = k, C = add(Q, mul(k.d, -.35 * U));
    K.corte(u, 0, 1, s => pol(C, .95 * U, ang - rad(75) + rad(150) * s), U * .16, "#bcd6ff");
    K.corte(u, .14, .86, s => pol(add(C, mul(k.nr, .1 * U)), .7 * U, ang + rad(60) - rad(120) * s), U * .07, "#bcd6ff");
    const t = cl((u - .3) / .4); if (t > 0 && t < 1) K.estrela(Q, U * .45 * EA.out(t), 1 - t);
  },
  faca(u, k, K) {
    const { Q, U } = k;
    [[-35, 0], [40, .2], [-5, .4]].forEach(([g, d0]) => {
      const a = k.ang + rad(g), A = pol(Q, -.55 * U, a), B = pol(Q, .55 * U, a);
      K.corte(u, d0, .45, s => lerp(A, B, s), U * .1, "#d9c6ff");
      const t = cl((u - d0 - .16) / .3); if (t > 0 && t < 1) K.estrela(B, U * .25 * EA.out(t), 1 - t);
    });
  },
  garras(u, k, K) {
    const { Q, U } = k;
    [-1, 0, 1].forEach((j, n) => {
      const c = add(Q, mul(k.nr, j * .3 * U)), A = add(c, add(mul(k.d, -.5 * U), mul(k.nr, -.12 * U))), B = add(c, add(mul(k.d, .5 * U), mul(k.nr, .12 * U)));
      K.corte(u, n * .07, .6, s => lerp(A, B, s), U * .09, "#ffb3a6");
    });
    const t = cl((u - .3) / .4); if (t > 0 && t < 1) K.estrela(Q, U * .35 * EA.out(t), 1 - t);
  },
  machado(u, k, K) { golpePesado(u, k, K, { g0: 100, g1: -15, T: .46, w: .2, halo: "#ffd2c4", rach: true, cor: "#ffe3d8" }); },
  porrete(u, k, K) { golpePesado(u, k, K, { g0: -100, g1: 15, T: .45, w: .2, halo: "#f1dfc2", rach: false, cor: "#f1dfc2" }); },
  martelo(u, k, K) {
    const { Q, U } = k, T = .4, p = EA.in(cl(u / T)), fade = 1 - cl((u - T - .2) / .25);
    const topo = add(Q, [0, -1.7 * U * (1 - p)]);
    K.seg(add(topo, [0, -.5 * U]), topo, U * .08, fade);
    K.seg(add(topo, [-.38 * U, 0]), add(topo, [.38 * U, 0]), U * .3, fade, "#f1ebe0");
    if (u >= T) {
      const t = (u - T) / (1 - T), t2 = cl(t * 1.3 - .2);
      K.anel(Q, U * (.15 + 1.1 * EA.out(t)), U * .12 * (1 - t), 1 - t, "#ffd9a0"); K.anel(Q, U * (.1 + .75 * EA.out(t2)), U * .07 * (1 - t2), .9 * (1 - t2));
      K.chispas(Q, t, 14, 1.3 * U, "#ffbf5a", U * .06); K.estrela(Q, U * .5 * EA.out(cl(t / .3)), 1 - cl(t / .35));
    }
  },
  lanca(u, k, K) {
    const { O, Q, U } = k, T = .3, p = EA.out(cl(u / T)), fade = 1 - cl((u - T - .3) / .3);
    const base = add(O, mul(k.d, k.s * .5)), ponta = lerp(base, Q, p), cauda = lerp(base, ponta, Math.max(0, 1 - 1.6 * U / Math.max(1, Math.hypot(ponta[0] - base[0], ponta[1] - base[1]))));
    const vib = u > T ? Math.sin(u * 150) * U * .04 * Math.pow(1 - cl((u - T) / .3), 2) : 0, v = mul(k.nr, vib);
    K.seg(add(cauda, v), add(ponta, v), U * .07, fade * .9); K.seg(add(ponta, v), add(add(ponta, v), mul(k.d, .22 * U)), U * .16, fade);
    if (p < 1) for (let i = 0; i < 4; i++) { const o = mul(k.nr, (i - 1.5) * .16 * U); K.seg(add(cauda, add(o, mul(k.d, -.2 * U))), add(cauda, add(o, mul(k.d, -.8 * U))), U * .03, .7 * (1 - p)); }
    if (u >= T) { const t = cl((u - T) / .5); K.estrela(Q, U * .42 * EA.out(cl(t / .4)), 1 - cl(t / .5)); K.anel(Q, U * (.12 + .5 * EA.out(t)), U * .08 * (1 - t), .9 * (1 - t)); }
  },
  flecha(u, k, K) {
    const { O, Q, U } = k, T = .45, p = EA.io(cl(u / T)), fade = 1 - cl((u - T - .3) / .3);
    const base = add(O, mul(k.d, k.s * .5)), pos = lerp(base, Q, p), ca = add(pos, mul(k.d, -.7 * U));
    K.seg(ca, pos, U * .05, fade); K.seg(pos, add(pos, mul(k.d, .1 * U)), U * .12, fade);
    [-1, 1].forEach(j => K.seg(ca, add(add(ca, mul(k.d, -.12 * U)), mul(k.nr, j * .1 * U)), U * .04, fade));
    if (p < 1) for (let i = 0; i < 3; i++) K.seg(add(ca, add(mul(k.nr, (i - 1) * .2 * U), mul(k.d, -.1 * U))), add(ca, add(mul(k.nr, (i - 1) * .2 * U), mul(k.d, -.6 * U))), U * .03, .6 * (1 - p));
    if (u >= T) { const t = cl((u - T) / .45); K.estrela(Q, U * .4 * EA.out(cl(t / .4)), 1 - cl(t / .5)); K.anel(Q, U * (.1 + .45 * EA.out(t)), U * .07 * (1 - t), .9 * (1 - t)); }
  },
  vespas(u, k, K) {
    const { O, Q, U } = k, base = add(O, mul(k.d, k.s * .5));
    for (let i = 0; i < 14; i++) {
      const q = cl(u - hs(i, 5) * .12), op = cl(q / .06) * (1 - cl((q - .78) / .22));
      if (op <= 0) continue;
      const voo = EA.io(cl(q / .45)), orb = cl((q - .4) / .5);
      let p = lerp(base, Q, voo); p = add(p, mul(k.nr, Math.sin(q * 20 + i * 2) * .22 * U * (1 - voo * .5)));
      if (q > .4) p = add(Q, pol([0, 0], U * (.15 + hs(i, 2) * .55), hs(i, 1) * 6.283 + orb * (4 + hs(i, 3) * 4) * (i % 2 ? 1 : -1)));
      const h = pol([0, 0], 1, hs(i, 4) * 6.283 + q * 25), c2 = add(p, mul(h, .13 * U)), fl = Math.abs(Math.sin(q * 160 + i * 3));
      K.seg(p, c2, U * .09, op);
      const m = lerp(p, c2, .5), w = [-h[1], h[0]];
      K.seg(m, add(m, mul(w, (.05 + .1 * fl) * U)), U * .04, op * .8); K.seg(m, add(m, mul(w, -(.05 + .1 * fl) * U)), U * .04, op * .8);
    }
  }
};
// Golpe pesado (machado, porrete): a arma gira ao redor do atacante e bate no ponto do golpe.
function golpePesado(u, k, K, o) {
  const { O, Q, U } = k, p = EA.io(cl(u / o.T)), g = o.g0 + (o.g1 - o.g0) * p, fade = 1 - cl((u - o.T - .3) / .3);
  const R0 = k.s * .5, R1 = k.s * .5 + 1.1 * U, a = k.ang + rad(g);
  if (p > .03) K.corte(Math.min(.99, p), 0, 1, s => pol(O, R1 * .92, k.ang + rad(o.g0 + (g - o.g0) * s)), U * o.w, o.halo, fade * .9);
  K.seg(pol(O, R0, a), pol(O, R1, a), U * .1, fade, o.cor); K.seg(pol(O, R1 - .3 * U, a), pol(O, R1, a), U * .22, fade, "#f1ebe0");
  if (u >= o.T) {
    const t = (u - o.T) / (1 - o.T);
    K.estrela(Q, U * .55 * EA.out(cl(t / .3)), 1 - cl(t / .4)); K.anel(Q, U * (.12 + 1.1 * EA.out(t)), U * .1 * (1 - t), 1 - t);
    if (o.rach) for (let i = 0; i < 7; i++) { const ag = i * 51 * Math.PI / 180 + hs(i, 3), r = (.35 + hs(i, 4) * .75) * U * EA.out(cl(t / .4)); K.seg(Q, pol(Q, r, ag), U * .05 * (1 - t) + 1, 1 - cl((t - .35) / .65)); }
    else for (let i = 0; i < 6; i++) { const ag = hs(i, 8) * 6.283, r = (.2 + .9 * EA.out(t) * (.4 + hs(i, 9) * .6)) * U; K.seg(pol(Q, r, ag), pol(Q, r + .12 * U, ag), U * .13 * (1 - t), .4 * (1 - t), "#f1dfc2"); }
  }
}

const espera = ms => new Promise(r => setTimeout(r, ms));
const quadro = () => new Promise(r => requestAnimationFrame(r));
const POOL = 150;

async function tocar(fx, O, T, s, U) {
  const dir = T ? [T[0] - O[0], T[1] - O[1]] : [1, 0], dist = Math.hypot(dir[0], dir[1]) || 1, d0 = [dir[0] / dist, dir[1] / dist];
  const distante = fx === "flecha" || fx === "vespas";
  const Q = distante ? (T || add(O, mul(d0, 5 * U))) : (T && dist <= s * .5 + 2.4 * U ? T : add(O, mul(d0, s * .5 + .9 * U)));
  const dq = [Q[0] - O[0], Q[1] - O[1]], lq = Math.hypot(dq[0], dq[1]) || 1, d = [dq[0] / lq, dq[1] / lq];
  const k = { O, Q, T, d, nr: [-d[1], d[0]], ang: Math.atan2(d[1], d[0]), s, U };
  const itens = Array.from({ length: POOL }, () => buildLine().startPosition({ x: 0, y: 0 }).endPosition({ x: 0, y: 0 }).strokeColor("#ffffff").strokeOpacity(1).strokeWidth(4).layer("ATTACHMENT").disableHit(true).locked(true).visible(false).build());
  const idx = new Map(itens.map((it, i) => [it.id, i])), dur = FX_DUR[fx] || 900;
  try {
    await OBR.scene.local.addItems(itens);
    const t0 = performance.now();
    for (;;) {
      const u = cl((performance.now() - t0) / dur), L = [];
      FX[fx](u, k, kit(L, U));
      await OBR.scene.local.updateItems(it => idx.has(it.id), drafts => {
        for (const dr of drafts) {
          const s = L[idx.get(dr.id)];
          if (!s) { dr.visible = false; continue; }
          dr.visible = true; dr.startPosition = { x: s[0][0], y: s[0][1] }; dr.endPosition = { x: s[1][0], y: s[1][1] };
          dr.style.strokeWidth = s[2]; dr.style.strokeOpacity = Math.min(1, s[3]); dr.style.strokeColor = s[4];
        }
      });
      if (u >= 1) break;
      await quadro();
    }
  } finally {
    try { await OBR.scene.local.deleteItems(itens.map(i => i.id)); } catch {}
  }
}

// Acha o token do atacante (e o alvo) e dispara o efeito.
async function efeitoMapa(r) {
  if (!FX[r.fx] || !(await OBR.scene.isReady())) return;
  const ref = r.en ? { k: "e", i: r.en } : { k: "p", i: r.c };
  if (!ref.i) return;
  const t0 = Date.now();
  const toks = await OBR.scene.items.getItems(it => it.metadata && it.metadata[TK]);
  const meu = toks.find(t => t.metadata[TK].k === ref.k && t.metadata[TK].i === ref.i);
  if (!meu) return;
  const centro = async id => { const b = await OBR.scene.items.getItemBounds([id]); return { c: [b.center.x, b.center.y], s: Math.max(b.width, b.height) }; };
  const o = await centro(meu.id);
  const U = (await OBR.scene.grid.getDpi()) || 150;
  let T = Array.isArray(r.tg) ? r.tg : null;
  if (!T) { // sem alvo escolhido: o token vinculado mais próximo
    let melhor = 1e12;
    for (const t of toks) if (t.id !== meu.id) { const c = (await centro(t.id)).c, dd = Math.hypot(c[0] - o.c[0], c[1] - o.c[1]); if (dd < melhor) { melhor = dd; T = c; } }
  }
  await espera(Math.max(0, FX_T0 - (Date.now() - t0)));
  await tocar(r.fx, o.c, T, o.s, U);
}

if (OBR.isAvailable) {
  OBR.onReady(async () => {
    const eu = await OBR.player.getId();
    const vistos = new Set(todas(await OBR.room.getMetadata()).map(r => r.i));

    // Aviso de turno: quando muda a vez no combate, avisa a mesa (e destaca para o dono do personagem).
    const sig = md => { const c = (md || {})["rpg.fichas/combat"]; return c && c.on && c.ord && c.ord[c.turn] ? `${c.round}:${c.turn}:${c.ord[c.turn].i}` : ""; };
    let ultimo = sig(await OBR.room.getMetadata());

    OBR.room.onMetadataChange(md => {
      const s = sig(md);
      if (s && s !== ultimo) {
        const c = md["rpg.fichas/combat"], o = c.ord[c.turn], meu = (md["rpg.fichas/assign"] || {})[eu] === o.i && o.t === "p";
        OBR.notification.show(meu ? `É a sua vez! — ${o.n} (rodada ${c.round})` : `Rodada ${c.round}: vez de ${o.n}`, meu ? "SUCCESS" : "DEFAULT");
      }
      ultimo = s;
      const novas = todas(md).filter(r => !vistos.has(r.i)).sort((a, b) => a.ts - b.ts);
      for (const r of novas) {
        vistos.add(r.i);
        if (r.fx && Date.now() - r.ts < 6000) efeitoMapa(r).catch(() => {}); // todos veem o golpe saindo do token
        if (r.pid === eu) continue;
        let txt = `${r.p}${r.cn ? " (" + r.cn + ")" : ""} — ${r.l}: ${r.t}`;
        if (r.dm != null) txt += ` · dano ${r.dm}`;
        if (r.dt != null) txt += r.ok ? " · passou" : " · falhou";
        OBR.notification.show(txt);
      }
    });
  });
}
</script>
</body>
</html>
