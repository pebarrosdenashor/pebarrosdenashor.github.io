<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichas de Ballynyr</title>
<style>
:root{--bg:#161d1c;--card:#202a28;--line:#3a4a46;--tx:#e9e3d0;--mut:#9aa89f;--ac:#5f9e88;--ouro:#d2a850;--ruim:#c9644e;--ok:#8cbf72}
*{box-sizing:border-box}
body{margin:0;padding:10px;background:var(--bg);color:var(--tx);font:14px/1.4 Georgia,"Times New Roman",serif}
h1{margin:8px 0 0;font-size:22px;font-weight:700;letter-spacing:.3px}
h2{margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--ouro)}
.sub{color:var(--mut);font-size:12px}
button{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:5px 8px;cursor:pointer}
button:hover{border-color:var(--ouro)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ouro);outline-offset:1px}
button.on{background:var(--ac);border-color:var(--ac);color:#0f1514}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tabs button{white-space:nowrap}
.row{display:flex;align-items:center;gap:5px;margin:5px 0}
.row>b{width:28px;color:var(--mut)}
.bar{flex:1;position:relative;height:24px;background:#0f1514;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ac)}
.bar.pv i{background:var(--ruim)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid button{display:flex;justify-content:space-between;gap:6px;text-align:left}
em{font-style:normal;color:var(--ouro);white-space:nowrap}
.armas{display:grid;gap:5px}
.armas button{display:flex;justify-content:space-between;border-color:var(--ouro)}
input[type=number]{width:64px;background:#0f1514;color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:5px}
.nota{font-size:12px;color:var(--mut);border-left:3px solid var(--line);padding-left:8px;margin:10px 0 0}
.lg{border-top:1px solid var(--line);padding:6px 0;font-size:13px}
.lg.big{background:var(--card);border:1px solid var(--ouro);border-radius:6px;padding:8px;margin-bottom:6px;font-size:14px}
.dv{display:inline-block;margin:0 3px 2px 0;padding:0 5px;border:1px solid var(--line);border-radius:4px}
.dv.u{border-color:var(--ruim);color:var(--ruim)}
.ok{color:var(--ok)}.no{color:var(--ruim)}
.fim{margin-top:14px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div id="app">Carregando…</div>
<script type="module">
import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";
import { FICHAS } from "./fichas.js";

const KEY = "rpg.fichas/estado";
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sinal = n => (n > 0 ? "+" : "") + n;

let st = { chars: {}, rolls: [] };
let player = { id: "local", name: "Jogador" };
let curId = null;
try { curId = localStorage.getItem("rpg.fichas/atual"); } catch {}
if (!FICHAS.some(f => f.id === curId)) curId = FICHAS[0].id;
const ui = { extra: { 4: 0, 6: 0, 8: 0 }, dt: "" };

const norm = s => ({ chars: s?.chars || {}, rolls: s?.rolls || [] });
const cur = () => FICHAS.find(f => f.id === curId);
const estado = f => { const c = st.chars[f.id] || {}; return { pv: c.pv ?? f.pv, pd: c.pd ?? f.pd, r: c.r ?? 0 }; };

async function persist() {
  render();
  if (!OBR.isAvailable) return;
  try { await OBR.room.setMetadata({ [KEY]: st }); }
  catch (e) { OBR.notification.show("Não foi possível salvar: " + (e?.message || e), "ERROR"); }
}

function setChar(f, patch) { st.chars[f.id] = { ...estado(f), ...patch }; }

function rolar(label, dados, opts = {}) {
  const f = cur();
  const extras = [];
  for (const d of [4, 6, 8]) for (let i = 0; i < ui.extra[d]; i++) extras.push(d);
  const r = [...dados, ...extras].map(d => [d, 1 + Math.floor(Math.random() * d)]);
  const v = r.map(x => x[1]);
  const t = v.reduce((a, b) => a + b, 0);
  const e = { id: Date.now() + "-" + Math.floor(Math.random() * 1e4), pid: player.id, p: player.name, cn: f.nome.split(" ")[0], l: label, r, t, ra: Math.max(...v), rb: Math.min(...v) };
  if (opts.dm != null) e.dm = e.ra + opts.dm;
  const dt = parseInt(ui.dt, 10);
  if (!isNaN(dt)) {
    e.dt = dt; e.ok = t >= dt;
    if (!e.ok && f.res?.k === "impeto") {
      const c = estado(f);
      if (c.r < f.res.max) { setChar(f, { r: c.r + 1 }); e.im = 1; }
    }
  }
  st.rolls.unshift(e);
  st.rolls.length = Math.min(st.rolls.length, 15);
  ui.extra = { 4: 0, 6: 0, 8: 0 };
  persist();
}

function render() {
  const f = cur(), c = estado(f);
  const barra = (k, rot, val, max) => `<div class="row"><b>${rot}</b><div class="bar ${k}"><i style="width:${max ? Math.min(100, 100 * val / max) : 0}%"></i><span>${val} / ${max}</span></div>${[-5, -1, 1, 5].map(n => `<button data-a="hp" data-k="${k}" data-n="${n}">${sinal(n)}</button>`).join("")}</div>`;
  const res = f.res ? `<div class="row"><b></b><div class="bar"><i style="width:${100 * c.r / f.res.max}%"></i><span>${f.res.n}: ${c.r} / ${f.res.max}</span></div>${[-1, 1].map(n => `<button data-a="res" data-n="${n}">${sinal(n)}</button>`).join("")}</div>` : "";
  const log = st.rolls.map((e, i) => `<div class="lg ${i === 0 ? "big" : ""}"><div><b>${esc(e.p)}</b> · ${esc(e.cn)} — ${esc(e.l)}</div><div>${e.r.map(([d, v]) => `<span class="dv ${v === 1 ? "u" : ""}">d${d}: ${v}</span>`).join("")}= <b>${e.t}</b> · RA ${e.ra} · RB ${e.rb}${e.dm != null ? ` · dano <b>${e.dm}</b>` : ""}${e.dt != null ? ` · DT ${e.dt} <b class="${e.ok ? "ok" : "no"}">${e.ok ? "passou" : "falhou"}</b>` : ""}${e.im ? " · +1 ímpeto" : ""}</div></div>`).join("") || `<div class="sub">Nenhuma rolagem ainda.</div>`;

  $app.innerHTML = `
  <div class="tabs">${FICHAS.map(x => `<button data-a="pick" data-id="${x.id}" class="${x.id === curId ? "on" : ""}">${esc(x.nome.split(" ")[0] === "Irmão" ? "Cavan" : x.nome.split(" ")[0])}</button>`).join("")}</div>
  <h1>${esc(f.nome)}</h1><div class="sub">${esc(f.cls)} · nível 3</div>
  ${barra("pv", "PV", c.pv, f.pv)}${barra("pd", "PD", c.pd, f.pd)}${res}
  <h2>Opções da rolagem</h2>
  <div class="row"><span>DT</span><input type="number" id="dt" value="${esc(ui.dt)}" placeholder="—" aria-label="Dificuldade (DT)">
  ${[4, 6, 8].map(d => `<button data-a="ex" data-d="${d}" class="${ui.extra[d] ? "on" : ""}">+d${d}${ui.extra[d] ? " ×" + ui.extra[d] : ""}</button>`).join("")}
  <button data-a="exclr" aria-label="Limpar dados extras">limpar</button></div>
  <h2>Ataques</h2>
  <div class="armas">${f.armas.map((w, i) => `<button data-a="atk" data-i="${i}">${esc(w[0])}<em>${w[1]} · RA${sinal(w[2])}</em></button>`).join("")}</div>
  <h2>Atributos</h2>
  <div class="grid">${Object.entries(f.at).map(([n, d]) => `<button data-a="at" data-n="${n}">${n}<em>d${d}</em></button>`).join("")}</div>
  <h2>Perícias</h2>
  <div class="grid">${f.sk.map((s, i) => `<button data-a="sk" data-i="${i}">${esc(s[0])}<em>d${s[1]}+d${s[2]}</em></button>`).join("")}</div>
  <p class="nota">${esc(f.nota)}</p>
  <h2>Rolagens da mesa</h2>${log}
  <div class="fim"><span class="sub">RA = maior dado · RB = menor dado</span><button data-a="rest">Descansar</button></div>`;
}

document.addEventListener("input", e => { if (e.target.id === "dt") ui.dt = e.target.value; });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const f = cur(), c = estado(f), d = b.dataset;
  switch (d.a) {
    case "pick": curId = d.id; try { localStorage.setItem("rpg.fichas/atual", curId); } catch {} render(); break;
    case "hp": setChar(f, { [d.k]: Math.max(0, Math.min(f[d.k], c[d.k] + +d.n)) }); persist(); break;
    case "res": setChar(f, { r: Math.max(0, Math.min(f.res.max, c.r + +d.n)) }); persist(); break;
    case "ex": ui.extra[d.d] = (ui.extra[d.d] + 1) % 4; render(); break;
    case "exclr": ui.extra = { 4: 0, 6: 0, 8: 0 }; render(); break;
    case "sk": { const s = f.sk[+d.i]; rolar(s[0], [s[1], s[2]]); break; }
    case "at": rolar(d.n, [f.at[d.n]]); break;
    case "atk": { const w = f.armas[+d.i], s = f.sk.find(x => x[0] === w[1]); rolar(`${w[0]} (${w[1]})`, [s[1], s[2]], { dm: w[2] }); break; }
    case "rest": st.chars[f.id] = { pv: f.pv, pd: f.pd, r: 0 }; persist(); break;
  }
});

async function iniciar() {
  if (OBR.isAvailable) {
    player.id = await OBR.player.getId();
    player.name = (await OBR.player.getName()) || "Jogador";
    st = norm((await OBR.room.getMetadata())[KEY]);
    OBR.room.onMetadataChange(md => { st = norm(md[KEY]); render(); });
  }
  render();
}
if (OBR.isAvailable) OBR.onReady(iniciar); else iniciar();
</script>
</body>
</html>
